name: Haskell CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  cabal:
    name: ${{ matrix.os }} / ghc ${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macOS-26, windows-2025]
        ghc:
          - "9.2.8"
          - "9.4.8"

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Cabal and GHC
      uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
      with:
        ghc-version: ${{ matrix.ghc }}

    - name: Cache Linux/Mac
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ matrix.os != 'windows-2025' }}
      with:
        path: ~/.cabal
        key: -${{ runner.os }}-${{ matrix.ghc }}-build-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/cabal.project') }}-
        restore-keys: |
          -${{ runner.os }}-${{ matrix.ghc }}-build-
          -${{ runner.os }}-

    - name: Cache Windows
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ matrix.os == 'windows-2025' }}
      with:
        path: C:\sr\
        # path: ~/AppData/Roaming/cabal
        key: -${{ runner.os }}-${{ matrix.ghc }}-build-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/cabal.project') }}-
        restore-keys: |
          -${{ runner.os }}-${{ matrix.ghc }}-build-
          -${{ runner.os }}-

    - name: Install dependencies
      run: |
        cabal update
        cabal build --only-dependencies --enable-tests --enable-benchmarks

    - name: Build
      run: cabal build --enable-tests --enable-benchmarks all

    - name: Run tests
      run: cabal test all

  stack:
    name: ${{ matrix.os }} / stack ${{ matrix.stack-resolver }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macOS-26, windows-2025]
        stack-resolver:
          # - "--resolver nightly"  # stack nightly
          - ""  # default
          - "--resolver lts-21.25"  # ghc 9.4.8
          - "--resolver lts-21.21"  # ghc 9.4.7
          - "--resolver lts-21.11"  # ghc 9.4.6
          - "--resolver lts-21.7"  # ghc 9.4.5
          - "--resolver lts-20.26"  # ghc 9.2.8
          - "--resolver lts-20.24"  # ghc 9.2.7
          - "--resolver lts-20.12"  # ghc 8.2.6
          - "--resolver lts-20.11"  # ghc 9.2.5
          - "--resolver lts-12.26"  # ghc 8.4.4
          - "--resolver lts-12.14"  # ghc 8.4.3
        exclude:
          # LLVM is too old
          - os: macos-26
            stack-resolver: "--resolver lts-12.26"
          # LLVM is too old
          - os: macos-26
            stack-resolver: "--resolver lts-12.14"

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Haskell Stack
      uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
      with:
        enable-stack: true
        stack-no-global: true

    - name: Cache Linux/Mac
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ matrix.os != 'windows-2025' }}
      with:
        path: ~/.stack
        key: -${{ runner.os }}-${{ matrix.stack-resolver }}-

    - name: Cache Windows
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ matrix.os == 'windows-2025' }}
      with:
        path: C:\sr\
        # path: ~\AppData\Local\Programs\stack
        key: -${{ runner.os }}-${{ matrix.stack-resolver }}-

    - name: Setup
      run: |
        stack setup ${{ matrix.stack-resolver }}

    - name: Build
      run: |
        stack build ${{ matrix.stack-resolver }} --test --bench --no-run-tests --no-run-benchmarks

    - name: Test
      run: |
        stack test ${{ matrix.stack-resolver }}
